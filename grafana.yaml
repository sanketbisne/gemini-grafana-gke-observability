          "id": 10,
          "title": "Nginx CPU Utilization %",
          "type": "gauge",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(container_cpu_usage_seconds_total{pod=~\"sample-app-.*\", container=\"web\"}[5m])) by (pod) / sum(container_spec_cpu_quota{pod=~\"sample-app-.*\", container=\"web\"} / container_spec_cpu_period{pod=~\"sample-app-.*\", container=\"web\"}) by (pod) * 100",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "id": 11,
          "title": "Nginx Memory Utilization %",
          "type": "gauge",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              },
              "editorMode": "code",
              "expr": "sum(container_memory_working_set_bytes{pod=~\"sample-app-.*\", container=\"web\"}) by (pod) / sum(container_spec_memory_limit_bytes{pod=~\"sample-app-.*\", container=\"web\"}) by (pod) * 100",
              "legendFormat": "{{pod}}",
              "range": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
